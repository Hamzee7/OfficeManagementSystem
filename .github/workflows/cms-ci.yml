name: CMS CI
on:
  push: { paths: ["cms/**", ".github/workflows/cms-ci.yml"] }
  pull_request: { paths: ["cms/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cms } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cms/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { SESSION_SECRET: ci-only-secret }
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { SESSION_SECRET: ci-only-secret }
